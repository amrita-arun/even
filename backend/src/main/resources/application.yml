server:
  port: 8080

spring:
  application:
    name: even
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Used when SUPABASE_JWT_SECRET is unset (asymmetric / JWKS path).
          jwk-set-uri: ${SUPABASE_JWKS_URL:}

even:
  supabase:
    # Must match the "iss" claim on Supabase access tokens.
    issuer: ${SUPABASE_URL}/auth/v1
    # Optional. Set this to the legacy JWT Secret from Project Settings → API
    # if JWKS verification fails (HS256 projects).
    jwt-secret: ${SUPABASE_JWT_SECRET:}
  token-encryption-key: ${EVEN_TOKEN_ENCRYPTION_KEY:even-dev-token-key-change-me}
  plaid:
    live: ${PLAID_LIVE:false}
    client-id: ${PLAID_CLIENT_ID:}
    secret: ${PLAID_SECRET:}
    env: ${PLAID_ENV:sandbox}
    products: ${PLAID_PRODUCTS:transactions}
    webhook-url: ${PLAID_WEBHOOK_URL:}
    webhook-secret: ${PLAID_WEBHOOK_SECRET:}
    redirect-uri: ${PLAID_REDIRECT_URI:}
  bridge:
    secret: ${EVEN_BRIDGE_SECRET:}
  imessage:
    owner-handle: ${EVEN_IMESSAGE_HANDLE:}
  spectrum:
    line-phone: ${SPECTRUM_LINE_PHONE:}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2.server.resource: DEBUG
